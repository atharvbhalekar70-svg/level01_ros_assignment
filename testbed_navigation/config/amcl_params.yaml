amcl:
  ros__parameters:
    use_sim_time: true

    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    base_frame_id: "base_footprint"
    odom_frame_id: "odom"

    scan_topic: "scan"

    global_frame_id: "map"

    min_particles: 500
    max_particles: 2000
    update_min_d: 0.2
    update_min_a: 0.2

    laser_max_range: 12.0
    laser_min_range: 0.05
    laser_model_type: "likelihood_field"

    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
